* {

body {

.container {

h1 {

.subtitle {

    margin-bottom: 25px;
}

.back-button {

    padding: 11px 18px;
    background: #292d35;
    color: white;
    text-decoration: none;
    border-radius: 10px;
    font-weight: bold;
}

.tier {
    display: flex;
    min-height: 110px;
    margin: 12px 0;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid #30343d;
    background: #1b1e24;
}

.tier-label {
    width: 85px;
    min-width: 85px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: bold;
    color: #111;
}

.tier-items {
    flex: 1;
    display: flex;
    flex-wrap: wrap;
    align-content: flex-start;
    gap: 8px;
    padding: 10px;
    min-height: 110px;
}

.tier-s {
    background: #ff5959;
}

.tier-a {
    background: #ff9f43;
}

.tier-b {
    background: #ffd84d;
}

.tier-c {
    background: #65d56f;
}

.tier-d {
    background: #4db8ff;
}

.tier-e {
    background: #9b7cff;
}

.tier-f {
    background: #777;
}

.mod-card {
    width: 170px;
    min-height: 75px;
    padding: 10px;
    background: #292d35;
    border: 1px solid #444a55;
    border-radius: 10px;
    cursor: grab;
    user-select: none;
    touch-action: none;
    transition: transform 0.15s, opacity 0.15s;
}

.mod-card:active {
    cursor: grabbing;
}

.mod-card.dragging {
    opacity: 0.45;
    transform: scale(0.96);
}

.mod-name {
    font-weight: bold;
    font-size: 15px;
    margin-bottom: 6px;
}

.mod-game {
    color: #75b7ff;
    font-size: 12px;
}

.mod-device {
    color: #8ee79a;
    font-size: 12px;
    margin-top: 3px;
}

.pool {
    margin-top: 25px;
    padding: 15px;
    border: 1px solid #30343d;
    border-radius: 14px;
    background: #181b21;
}

.pool h2 {
    margin-top: 0;
}

.pool-items {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    min-height: 100px;
}

.controls {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
    margin: 20px 0;
}

button {
    border: 0;
    padding: 11px 17px;
    border-radius: 9px;
    background: #292d35;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #3a3f49;
}

.info {
    margin-top: 25px;
    padding: 15px;
    border-radius: 12px;
    background: #1b1e24;
    border: 1px solid #30343d;
    color: #aaa;
    line-height: 1.5;
}

@media (max-width: 600px) {

    .tier-label {
        width: 60px;
        min-width: 60px;
        font-size: 25px;
    }

    .mod-card {
        width: 145px;
        min-height: 70px;
    }

    .mod-name {
        font-size: 13px;
    }

}

/* =========================================================
   CREATE CARD
========================================================= */

function createCard(mod) {

    const card = document.createElement("div");

    card.className = "mod-card";

    card.dataset.id = mod.id;

    card.innerHTML = `

        <div class="mod-name">
            ${escapeHtml(mod.name)}
        </div>

        <div class="mod-game">
            🎮 ${escapeHtml(mod.game)}
        </div>

        <div class="mod-device">
            💻 ${escapeHtml(mod.device)}
        </div>

    `;

    addDragEvents(card);

    return card;
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* =========================================================
   DRAG SYSTEM
========================================================= */

let draggedCard = null;


/* Desktop */

function addDragEvents(card) {

    card.draggable = true;

    card.addEventListener("dragstart", () => {

        draggedCard = card;

        card.classList.add("dragging");

    });

    card.addEventListener("dragend", () => {

        card.classList.remove("dragging");

        draggedCard = null;

        saveTierList();

    });

}


/* =========================================================
   DROP AREAS
========================================================= */

const dropZones =
    document.querySelectorAll(".tier-items, .pool-items");


dropZones.forEach(zone => {

    zone.addEventListener("dragover", event => {

        event.preventDefault();

    });

    zone.addEventListener("drop", event => {

        event.preventDefault();

        if (!draggedCard) return;

        zone.appendChild(draggedCard);

        saveTierList();

    });

});


/* =========================================================
   MOBILE TOUCH DRAG
========================================================= */

let touchCard = null;
let touchClone = null;


document.addEventListener("touchstart", event => {

    const card =
        event.target.closest(".mod-card");

    if (!card) return;

    touchCard = card;

}, { passive: true });


document.addEventListener("touchmove", event => {

    if (!touchCard) return;

    const touch = event.touches[0];

    const element =
        document.elementFromPoint(
            touch.clientX,
            touch.clientY
        );

    const zone =
        element?.closest(
            ".tier-items, .pool-items"
        );

    if (zone) {

        zone.appendChild(touchCard);

    }

}, { passive: true });


document.addEventListener("touchend", () => {

    if (touchCard) {

        saveTierList();

    }

    touchCard = null;

});


/* =========================================================
   INITIAL LOAD
========================================================= */

function loadMods() {

    const saved =
        localStorage.getItem("THGM_TIER_LIST");

    if (saved) {

        const data =
            JSON.parse(saved);

        Object.keys(data).forEach(tier => {

            const zone =
                document.querySelector(
                    `[data-tier="${tier}"]`
                );

            if (!zone) return;

            data[tier].forEach(id => {

                const mod =
                    mods.find(
                        item => item.id === id
                    );

                if (mod) {

                    zone.appendChild(
                        createCard(mod)
                    );

                }

            });

        });

        /*
           Новые моды, которых ещё нет
           в сохранённом Tier List,
           отправляются в Pool.
        */

        const usedIds =
            Object.values(data).flat();

        mods.forEach(mod => {

            if (!usedIds.includes(mod.id)) {

                document
                    .querySelector('[data-tier="POOL"]')
                    .appendChild(
                        createCard(mod)
                    );

            }

        });

    } else {

        mods.forEach(mod => {

            document
                .querySelector('[data-tier="POOL"]')
                .appendChild(
                    createCard(mod)
                );

        });

    }

}


/* =========================================================
   SAVE
========================================================= */

function saveTierList() {

    const data = {};

    document
        .querySelectorAll(
            ".tier-items, .pool-items"
        )
        .forEach(zone => {

            const tier =
                zone.dataset.tier;

            data[tier] = [];

            zone
                .querySelectorAll(".mod-card")
                .forEach(card => {

                    data[tier].push(
                        card.dataset.id
                    );

                });

        });

    localStorage.setItem(
        "THGM_TIER_LIST",
        JSON.stringify(data)
    );

}


/* =========================================================
   RESET
========================================================= */

function resetTierList() {

    const confirmReset =
        confirm(
            "Reset the Tier List?"
        );

    if (!confirmReset) return;

    localStorage.removeItem(
        "THGM_TIER_LIST"
    );

    location.reload();

}


/* =========================================================
   START
========================================================= */

loadMods();
