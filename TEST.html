<html lang="en">

<style>

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    padding: 35px 0 80px;

    background: #101116;
    color: #ffffff;

    font-family: Arial, Helvetica, sans-serif;

    overflow-x: hidden;
}


/* =========================================================
   LIST
========================================================= */

#list {
    width: min(1450px, calc(100% - 40px));
    margin: 0 auto;
}


/* =========================================================
   SECTION TITLES
========================================================= */

.section-title {
    margin: 55px 0 25px;
    padding: 0 10px;

    font-size: 38px;
    line-height: 1.2;
    font-weight: 800;
}

.main-title {
    color: #72ff82;
}

.extended-title {
    color: #ffd45f;
}


/* =========================================================
   CARD
========================================================= */

.card {
    width: 100%;

    margin: 0 0 30px;
    padding: 55px 60px 62px;

    background: #1b1d24;

    border: 2px solid #30333d;
    border-radius: 32px;

    overflow: hidden;
}


/* =========================================================
   CARD TITLE
========================================================= */

.card-title {
    width: 100%;

    margin: 0 0 48px;

    color: #ffffff;

    font-size: 46px;
    font-weight: 800;

    line-height: 1.15;

    white-space: normal;

    overflow-wrap: break-word;
    word-break: normal;
}


/* =========================================================
   ROW
========================================================= */

.info-row {
    width: 100%;

    display: grid;

    gap: 28px;
    margin-bottom: 28px;

    align-items: stretch;
}


/* =========================================================
   FIRST ROW
   Granny / Mod / Platform
========================================================= */

.row-one {
    grid-template-columns:
        minmax(0, 1.35fr)
        minmax(0, 1.80fr)
        minmax(0, 0.82fr);
}


/* =========================================================
   SECOND ROW
   Type / Author
========================================================= */

.row-two {
    grid-template-columns:
        minmax(0, 1.25fr)
        minmax(0, 2.10fr);
}


/* =========================================================
   THIRD ROW
   Verified / Status
========================================================= */

.row-three {
    grid-template-columns:
        minmax(0, 1.45fr)
        minmax(0, 1.10fr);
}


/*
   IF THERE IS NO VERIFIER:
   STATUS USES THE WHOLE ROW
*/

.row-three.single {
    grid-template-columns: minmax(0, 1fr);
}


/* =========================================================
   INFORMATION BLOCK
========================================================= */

.info {
    min-width: 0;
    width: 100%;
    max-width: 100%;

    min-height: 108px;

    padding: 20px 34px;

    display: flex;
    align-items: center;

    border-radius: 25px;

    font-size: 28px;
    font-weight: 400;

    line-height: 1.2;

    white-space: normal;

    /*
       LONG TEXT STAYS INSIDE
       THE CARD
    */

    overflow-wrap: anywhere;
    word-break: normal;
}


/* =========================================================
   COLORS
========================================================= */

.blue {
    background: #1d2d4b;
    color: #70adff;
}

.pink {
    background: #3a222f;
    color: #ff83ba;
}

.green {
    background: #22372c;
    color: #82ed91;
}

.yellow {
    background: #44351e;
    color: #ffd36b;
}


/* =========================================================
   SECTION DIVIDER
========================================================= */

.section-divider {
    height: 3px;

    margin: 65px 0 10px;

    border-radius: 10px;

    background: #30333d;
}


/* =========================================================
   TABLET
========================================================= */

@media (max-width: 1000px) {

    #list {
        width: calc(100% - 24px);
    }

    .card {
        padding: 42px 34px 46px;
        border-radius: 28px;
    }

    .card-title {
        font-size: 38px;
        margin-bottom: 36px;
    }

    .info-row {
        gap: 18px;
        margin-bottom: 18px;
    }

    .info {
        min-height: 86px;

        padding: 16px 20px;

        border-radius: 22px;

        font-size: 23px;
    }

    .section-title {
        font-size: 32px;
    }
}


/* =========================================================
   MOBILE
   IMPORTANT:
   NEVER STACK EVERYTHING INTO ONE COLUMN
========================================================= */

@media (max-width: 700px) {

    #list {
        width: calc(100% - 12px);
    }

    .card {
        padding: 25px 14px 28px;
        border-radius: 24px;
    }

    .card-title {
        margin-bottom: 25px;

        font-size: clamp(21px, 6vw, 30px);

        line-height: 1.15;
    }


    /*
       THE ORIGINAL STRUCTURE REMAINS:

       3 BLOCKS
       2 BLOCKS
       2 BLOCKS
    */

    .row-one {
        grid-template-columns:
            minmax(0, 1.35fr)
            minmax(0, 1.80fr)
            minmax(0, 0.82fr);
    }

    .row-two {
        grid-template-columns:
            minmax(0, 1.25fr)
            minmax(0, 2.10fr);
    }

    .row-three {
        grid-template-columns:
            minmax(0, 1.45fr)
            minmax(0, 1.10fr);
    }

    .row-three.single {
        grid-template-columns: 1fr;
    }


    .info-row {
        gap: 10px;
        margin-bottom: 10px;
    }

    .info {
        min-height: 66px;

        padding: 12px 13px;

        border-radius: 19px;

        font-size: clamp(13px, 3.5vw, 19px);

        line-height: 1.15;

        overflow-wrap: anywhere;
    }

    .section-title {
        font-size: 25px;

        margin: 35px 0 18px;
    }

    .section-divider {
        margin: 45px 0 5px;
    }
}


/* =========================================================
   VERY SMALL PHONES
========================================================= */

@media (max-width: 420px) {

    #list {
        width: calc(100% - 8px);
    }

    .card {
        padding: 20px 10px 22px;

        border-radius: 21px;
    }

    .card-title {
        font-size: 20px;

        margin-bottom: 20px;
    }

    .info-row {
        gap: 7px;
        margin-bottom: 7px;
    }

    .info {
        min-height: 58px;

        padding: 9px;

        border-radius: 16px;

        font-size: 12px;
    }

    .section-title {
        font-size: 21px;
    }
}

/* =========================================================
   ICONS
========================================================= */

function grannyIcon(value) {

    if (value === "Granny 2") {
        return "🎮 Granny 2";
    }

    if (value === "Granny 3") {
        return "🎮 Granny 3";
    }

    return "🎮 Granny 1";
}


function deviceIcon(value) {

    if (!value) {
        return "";
    }

    if (value === "PC") {
        return "💻 PC";
    }

    if (value === "Mobile") {
        return "📱 Mobile";
    }

    if (value === "VR") {
        return "🥽 VR";
    }

    if (value === "Every") {
        return "💻 Every";
    }

    return "💻 " + value;
}


/* =========================================================
   BLOCK
========================================================= */

function block(text, color, icon = "") {

    if (!text) {
        return "";
    }

    return `
        <div class="info ${color}">
            ${icon}${text}
        </div>
    `;
}
